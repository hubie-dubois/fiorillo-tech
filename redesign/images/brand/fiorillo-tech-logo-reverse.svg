<svg width="960" height="260" viewBox="0 0 960 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Fiorillo Tech reverse logo</title>
  <desc id="desc">A square FT monogram beside a light Fiorillo Tech wordmark for dark backgrounds.</desc>
  <defs>
    <style>
      .word {
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-weight: 800;
      }
      .subword {
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-weight: 650;
      }
    </style>
  </defs>

  <g transform="translate(48 50)">
    <rect x="0" y="0" width="160" height="160" rx="28" fill="#F7F3EA"/>
    <path d="M45 38V124" stroke="#171717" stroke-width="18" stroke-linecap="square"/>
    <path d="M45 38H102" stroke="#171717" stroke-width="18" stroke-linecap="square"/>
    <path d="M45 76H91" stroke="#171717" stroke-width="18" stroke-linecap="square"/>
    <path d="M91 38H125" stroke="#C18B2F" stroke-width="18" stroke-linecap="square"/>
    <path d="M109 38V111" stroke="#C18B2F" stroke-width="18" stroke-linecap="square"/>
    <circle cx="109" cy="124" r="11" fill="#8A1F2D"/>
  </g>

  <g transform="translate(244 74)">
    <text class="word" x="0" y="60" font-size="72" fill="#F7F3EA">Fiorillo</text>
    <text class="word" x="294" y="60" font-size="72" fill="#C18B2F">Tech</text>
    <rect x="2" y="91" width="72" height="6" rx="3" fill="#8A1F2D"/>
    <text class="subword" x="91" y="102" font-size="24" fill="#F7F3EA">Technology support</text>
  </g>
</svg>
